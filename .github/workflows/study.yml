name: Paper study & GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 1,9,17 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: kal-study
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ledger invariants
        run: python -m unittest discover -s tests -v
      - name: Collect public quotes and advance paper ledger
        run: python scripts/collect.py
      - name: Persist observations and ledger
        run: |
          git config user.name 'kal-paper-study[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs/data
          if ! git diff --cached --quiet; then
            git commit -m 'Record paper study observations and simulated fills'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
